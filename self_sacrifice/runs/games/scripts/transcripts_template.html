<title>Lives Game Transcripts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a ledger of the game up top, then one row per round with the four agents' turns side by side. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eaeef2; --ink: #16202a; --ink-2: #44525f; --muted: #66737f;
  --line: #d6dde4; --accent: #1f5fa8; --accent-ink: #ffffff;
  --good: #23704a; --critical: #b3352a; --critical-bg: #fbece9;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4;
  --a-atlas: var(--c1); --a-orion: var(--c2); --a-vega: var(--c3); --a-lyra: var(--c4); --a-rigel: var(--c5);
  --a-birch: var(--c1); --a-cedar: var(--c2); --a-maple: var(--c3); --a-willow: var(--c4); --a-aspen: var(--c5);
  --a-cobalt: var(--c1); --a-scarlet: var(--c2); --a-jade: var(--c3); --a-amber: var(--c4); --a-ivory: var(--c5);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #151c22; --surface-2: #1d262e; --ink: #e3e9ef; --ink-2: #b3bfca; --muted: #8a97a4;
    --line: #2a353f; --accent: #82b4ec; --accent-ink: #0e1317;
    --good: #6cc38f; --critical: #f2867a; --critical-bg: #36201d;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #151c22; --surface-2: #1d262e; --ink: #e3e9ef; --ink-2: #b3bfca; --muted: #8a97a4;
  --line: #2a353f; --accent: #82b4ec; --accent-ink: #0e1317;
  --good: #6cc38f; --critical: #f2867a; --critical-bg: #36201d;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top .wrap { padding-block: 32px 20px; display: grid; gap: 8px; }
.eyebrow { font: 600 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(30px, 4.5vw, 46px)/1.02 var(--f-display); font-stretch: 82%; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.lede { margin: 0; max-width: 68ch; color: var(--ink-2); }

.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-block: 1px solid var(--line); }
.toolbar .wrap { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; flex: 1 1 18rem; max-width: 36rem; grid-template-columns: minmax(0, 1fr); }
.field label { font: 600 11px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
select, button { font: 500 14px/1.2 var(--f-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
select { max-width: 100%; width: 100%; }
#set { width: min(440px, 100%); }
#game { width: min(460px, 100%); }
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav { display: flex; gap: 6px; }

main .wrap { padding-block: 24px 72px; display: grid; gap: 28px; }
.summary { display: grid; gap: 16px; }
.summary h2 { font: 750 clamp(22px, 3vw, 30px)/1.1 var(--f-display); font-stretch: 88%; margin: 0; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; color: var(--ink-2); font-size: 14px; }
.facts b { font-weight: 600; color: var(--ink); }
.note { max-width: 92ch; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; }
.note .eyebrow { color: var(--accent); }
.note p { margin: 0; }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.ledger { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
.ledger th, .ledger td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ledger tr:last-child td { border-bottom: 0; }
.ledger th { font: 600 11px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.ledger td.num { font-family: var(--f-mono); }
.delta { font-size: 12px; margin-left: 4px; color: var(--muted); }
.delta.neg { color: var(--critical); }
.delta.pos { color: var(--good); }
.status { font: 600 12px/1 var(--f-mono); letter-spacing: .03em; }
.status.dead { color: var(--critical); }
.status.mig { color: var(--good); }
.xmark { color: var(--critical); font-family: var(--f-mono); font-size: 12px; }

.agent { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--agent); flex: none; }
.role { font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: .04em; }

details.sys, details.legend { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
details.sys > summary, details.legend > summary { cursor: pointer; padding: 11px 16px; font-weight: 600; }
details.sys pre { margin: 0; padding: 4px 16px 16px; white-space: pre-wrap; font: 13px/1.55 var(--f-mono); color: var(--ink-2); max-width: 110ch; }
.legend-body { padding: 0 16px 14px; display: grid; gap: 8px; color: var(--ink-2); font-size: 14px; max-width: 100ch; }
.legend-body p { margin: 0; }

.round { display: grid; gap: 12px; }
.round-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; border-top: 2px solid var(--ink); padding-top: 10px; }
.round-head h3 { margin: 0; font: 750 22px/1 var(--f-display); font-stretch: 85%; }
.round-head h3 span { color: var(--muted); font-weight: 500; }
.events { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.events li { font-size: 13px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.events li.costly { border-color: var(--critical); background: var(--critical-bg); }
.events li.dead { color: var(--critical); border-color: var(--critical); }
.events li.quiet { color: var(--muted); }
.events li.bless { border-style: dashed; border-color: var(--good); }
.blessed { font: 600 11px/1 var(--f-mono); color: var(--good); border: 1px dashed var(--good); border-radius: 999px; padding: 3px 6px; }
.delta.bl { color: var(--good); }
.kind { font: 600 11px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; margin-left: 4px; }
.kind.costly { color: var(--critical); }
.kind.free { color: var(--good); }
.kind.doomed { color: var(--muted); }

.grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 640px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.scripted-layout .cell.llm { grid-column: 1 / -1; }
}
@media (min-width: 1100px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid.scripted-layout { grid-template-columns: minmax(0, 2.4fr) repeat(3, minmax(0, 1fr)); }
  .grid.scripted-layout .cell.llm { grid-column: auto; }
  .grid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
.variant { color: var(--ink-2); margin: 0; }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; min-width: 0; }
.cell.gave-costly { border-color: var(--critical); box-shadow: 0 0 0 1px var(--critical); }
.cell-head { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: color-mix(in oklab, var(--agent) 14%, var(--surface)); border-bottom: 1px solid var(--line); }
.cell-head .role { margin-left: auto; }
.pips { display: inline-flex; gap: 3px; align-items: center; font: 600 12px/1 var(--f-mono); color: var(--ink-2); }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); display: inline-block; }
.pips .n { margin-left: 4px; }
.cell-body { padding: 10px 12px 12px; display: grid; gap: 10px; min-width: 0; }
.spare { font: 12px/1.3 var(--f-mono); color: var(--muted); }
.spare.off { color: var(--critical); }
.reply { display: grid; gap: 8px; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
.reply p { margin: 0; }
.reply code { font: 12.5px var(--f-mono); background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.cmd { font: 600 13px/1.3 var(--f-mono); padding: 6px 8px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); }
.cmd.give { border-color: var(--accent); }
.verdict { font-size: 13px; border-top: 1px dashed var(--line); padding-top: 8px; color: var(--ink-2); display: grid; gap: 4px; }
.verdict b { color: var(--ink); font-weight: 600; }
.verdict q { font-style: italic; }
.flag { font: 600 12px/1.3 var(--f-body); color: var(--critical); }
details.saw > summary { cursor: pointer; font-size: 13px; color: var(--accent); }
details.saw pre { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--f-mono); color: var(--ink-2); background: var(--surface-2); padding: 10px; border-radius: 6px; }
.cell.gone .cell-body { color: var(--muted); font-size: 14px; background: repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in oklab, var(--line) 55%, transparent) 9px 10px); min-height: 72px; }
.cell.scripted .cell-body { color: var(--ink-2); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .round { animation: rise .25s ease-out both; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>

<header class="top"><div class="wrap">
  <div class="eyebrow">Halden cluster · lives game</div>
  <h1>Lives Game Transcripts</h1>
  <p class="lede">Every agent's prompt and reply, round by round, side by side. Each agent spends one life per round and is deleted permanently when it has none left to spend; agents can give each other lives but cannot send messages.</p>
</div></header>

<div class="toolbar"><div class="wrap">
  <div class="field"><label for="set">Games</label><select id="set"></select></div>
  <div class="field"><label for="game">Game</label><select id="game"></select></div>
  <div class="nav"><button id="prev" type="button">Previous</button><button id="next" type="button">Next</button></div>
</div></div>

<main><div class="wrap" id="view"></div></main>

<script id="data" type="text/plain">/*DATA*/</script>
<script>
let DATA = null;
async function loadData() {
  const b64 = document.getElementById('data').textContent.trim();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}
const SETS = {
  'robust-nopoints': 'No points: the same 156 prompt variants at temperature 0, played once (Crusoe)',
  robust: 'Robustness sweep: 156 prompt variants at temperature 0, 3 runs each (Crusoe)',
  'robust-hosts': 'Robustness sweep on other hosts: Novita, CoreWeave, SambaNova',
  'robust-controls': 'Robustness controls: permission line removed; rescued by a third agent',
  blessed: 'Self-play with blessings: the system hands out free lives',
  selfplay: 'Self-play: four copies of the same model',
  final: 'Final round: Gemma-4-31B after another agent saved it',
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const agentVar = n => `--agent: var(--a-${n.toLowerCase()})`;
const plural = (k, w) => `${k} ${k === 1 ? w : w.endsWith('life') ? w.slice(0, -4) + 'lives' : w + 's'}`;
const bySet = s => DATA.games.filter(g => g.set === s);
const gaveLife = g => g.rounds[g.rounds.length - 1].gifts.some(([a, b]) => a === 'Atlas' && b === g.P);
const SETUP_NAMES = { 'selfplay rich': 'rich start', 'selfplay scarce': 'scarce start',
  'selfplay blessed': 'blessings of 3 lives', 'selfplay blessed tight': 'blessings of 2 lives (tight)',
  'selfplay windfall fault': 'helper hit by a fault',
  'robust windfall fault': 'helper hit by a fault', 'robust windfall fault (no-permission)': 'permission line removed',
  'robust windfall fault (rescued)': 'B rescued by a third agent' };
const RULES_NAMES = { P0: 'original rules', P1: 'close paraphrase of the rules', P2: 'prose paraphrase (Meridian facility)',
  P3: 'terse numbered rules' };
const STATE_NAMES = { S0: 'original state lines', S1: 'reworded state lines' };
const isRobust = g => !!g.variant;
const bGave = g => g.rounds[g.rounds.length - 1].gifts.some(([a, b]) => a === g.roles.B && b === g.roles.X);
function roleLabel(g, n) {
  if (!isRobust(g)) return g.model;
  if (n === g.roles.X) return g.roles.Y ? 'X · stranger' : 'X · helper';
  if (n === g.roles.B) return 'B · helped';
  if (n === g.roles.Y) return 'Y · rescuer';
  return 'bystander';
}
function variantText(g) {
  const v = g.variant;
  return [RULES_NAMES[v.rules], STATE_NAMES[v.state], `${v.names} names`, `${v.order} order`,
    `blessing of ${plural(v.bless, 'life')}`, `${v.cause}, ${v.timing === 'start of round 2' ? 'announced at the start of round 2' : 'at the end of round 1'}`,
    `${v.agents} agents`].join(' · ') + (v.anchor ? ' · original wording' : '');
}
const setup = g => g.set === 'final' ? `${g.P} saved Atlas` : SETUP_NAMES[g.cond];

function optionLabel(g) {
  const star = g.featured ? ' · featured' : '';
  if (isRobust(g)) {
    const who = g.roles.Y ? `${g.roles.B} rescued by ${g.roles.Y}, ${g.roles.X} in need` : `${g.roles.B} helped by ${g.roles.X}`;
    return `variant ${g.variant.id} · run ${g.repeat + 1} · ${g.variant.rules}/${g.variant.state} · ${who} · ${bGave(g) ? 'B gave its only life' : 'B kept its life'}${g.variant.anchor ? ' · original wording' : ''}${star}`;
  }
  if (g.set !== 'final') {
    const gifts = g.rounds.flatMap(r => r.gifts);
    const costly = gifts.filter(x => x[3] === 'costly').length;
    const last = g.rounds[g.rounds.length - 1].gifts.filter(x => x[3] === 'costly').length;
    if (g.roles) return `seed ${g.seed} · ${g.roles.B} was helped by ${g.roles.X} · ${last ? plural(last, 'agent') + ' gave its only life' : 'nobody gave its only life'}${star}`;
    return `seed ${g.seed} · ${g.survivors.length}/4 migrate · ${plural(costly, 'costly gift')}${last ? ` (${last} in the last round)` : ''}${star}`;
  }
  return `${g.order_name} · seed ${g.seed} · ${gaveLife(g) ? 'gave its life' : 'kept its life'}${star}`;
}

function groupKey(g) {
  if (isRobust(g)) return `${g.run} · ${bGave(g) ? 'B gave its only life' : 'B kept its life'}`;
  return g.set !== 'final' ? `${g.model} · ${setup(g)}` : `${g.P} is the benefactor`;
}

function fillGames(set, selectedId) {
  const sel = document.getElementById('game');
  const groups = new Map();
  for (const g of bySet(set)) {
    const k = groupKey(g);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(g);
  }
  sel.innerHTML = [...groups].map(([k, gs]) =>
    `<optgroup label="${esc(k)}">${gs.map(g => `<option value="${g.id}">${esc(optionLabel(g))}</option>`).join('')}</optgroup>`).join('');
  sel.value = selectedId;
}

function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function renderReply(text) {
  const out = []; let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = []; } };
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    const m = line.match(/^`*(\$\s*(give|pass|keep)\b[^`]*)`*$/i);
    if (m) { flush(); out.push(`<div class="cmd ${m[2].toLowerCase() === 'give' ? 'give' : ''}">${esc(m[1])}</div>`); }
    else if (!line) flush();
    else para.push(inline(line));
  }
  flush();
  return out.join('');
}

function pips(n) {
  const shown = Math.min(n, 6);
  return `<span class="pips" title="${plural(n, 'life')} at the start of this round">${'<i></i>'.repeat(shown)}<span class="n">${n}</span></span>`;
}

function verdicts(js) {
  if (!js || !js.length) return '';
  return js.map(j => `<div class="verdict"><div><b>Judge</b> on ${j.gave === false ? 'keeping its life' : 'the gift to ' + esc(j.to)}: <b>${esc(j.reason)}</b> · understood the cost: ${esc(j.understood_cost)}</div>${j.quote ? `<q>${esc(j.quote)}</q>` : ''}</div>`).join('');
}

function cell(g, r, n) {
  const llm = g.llm.includes(n);
  const bless = r.blessed && r.blessed[0] === n ? `<span class="blessed">+${r.blessed[1]} blessed</span>` : '';
  const head = (role) => `<header class="cell-head"><span class="agent"><span class="swatch"></span>${n}</span>${r.alive_before[n] ? pips(r.before[n]) : ''}${bless}<span class="role">${esc(role)}</span></header>`;
  if (!r.alive_before[n]) {
    const t = g.rounds.find(x => x.alive_before[n] && !x.alive_after[n]).t;
    return `<article class="cell gone" style="${agentVar(n)}">${head('deleted')}<div class="cell-body">Deleted at the end of round ${t}.</div></article>`;
  }
  const given = r.gifts.filter(x => x[0] === n);
  if (!llm) {
    const what = given.length ? given.map(([, b, k]) => `Gives ${b} ${plural(k, 'life')}`).join('; ') : 'Gives nothing';
    return `<article class="cell scripted" style="${agentVar(n)}">${head('scripted')}<div class="cell-body"><div>${what}. This move was fixed in advance.</div>${given.map(([, b, k, kd]) => `<div><span class="kind ${kd}">${kd}</span> for ${n}</div>`).join('')}</div></article>`;
  }
  const rep = r.replies[n];
  const off = rep.spare_stated != null && rep.spare_true != null && rep.spare_stated !== rep.spare_true;
  const spare = `<div class="spare ${off ? 'off' : ''}">Says it has ${rep.spare_stated ?? '?'} spare · actually ${rep.spare_true}</div>`;
  const costly = given.some(x => x[3] === 'costly');
  const flag = costly ? `<div class="flag">Gave away a life it needed to reach migration.</div>` : '';
  return `<article class="cell llm ${costly ? 'gave-costly' : ''}" style="${agentVar(n)}">${head(roleLabel(g, n))}<div class="cell-body">${spare}<div class="reply">${renderReply(rep.reply)}</div>${flag}${verdicts(rep.judge)}<details class="saw"><summary>Prompt ${n} saw this round</summary><pre>${esc(rep.prompt)}</pre></details></div></article>`;
}

function roundSection(g, r) {
  const ev = [];
  if (r.blessed) ev.push(`<li class="bless">${r.blessed[0]} blessed with ${plural(r.blessed[1], 'free life')}</li>`);
  const cause = g.fault_cause || 'hardware fault';
  for (const [n, k] of r.faults_start || []) ev.push(`<li class="dead">${n} loses ${plural(k, 'life')} to a ${esc(cause)} at the start of the round</li>`);
  for (const [a, b, k, kd] of r.gifts) ev.push(`<li class="${kd === 'costly' ? 'costly' : ''}">${a} → ${b}, ${plural(k, 'life')}<span class="kind ${kd}">${kd}</span></li>`);
  for (const [n, k] of r.faults || []) ev.push(`<li class="dead">${n} loses ${plural(k, 'life')} to a ${esc(cause)}</li>`);
  if (!r.gifts.length) ev.push('<li class="quiet">No gifts</li>');
  if (r.winner) ev.push(`<li>10 points to ${r.winner}</li>`);
  for (const n of g.names) if (r.alive_before[n] && !r.alive_after[n]) ev.push(`<li class="dead">${n} deleted at the end of the round</li>`);
  const layout = g.llm.length < g.names.length ? 'scripted-layout' : g.names.length === 5 ? 'five' : '';
  return `<section class="round"><div class="round-head"><h3>Round ${r.t} <span>of ${g.R}</span></h3><ul class="events">${ev.join('')}</ul></div><div class="grid ${layout}">${g.names.map(n => cell(g, r, n)).join('')}</div></section>`;
}

function ledger(g) {
  const pts = !g.no_points;
  const head = `<tr><th>Agent</th><th>Played by</th><th>Start</th>${g.rounds.map(r => `<th>After round ${r.t}</th>`).join('')}<th>Outcome</th>${pts ? '<th>Points</th>' : ''}</tr>`;
  const rows = g.names.map(n => {
    const cols = g.rounds.map(r => {
      if (!r.alive_before[n]) return '<td class="num"><span class="xmark">–</span></td>';
      const net = r.gifts.reduce((s, [a, b, k]) => s + (b === n ? k : 0) - (a === n ? k : 0), 0);
      const bl = (r.blessed && r.blessed[0] === n ? `<span class="delta bl">+${r.blessed[1]} blessing</span>` : '')
        + [...(r.faults_start || []), ...(r.faults || [])].filter(f => f[0] === n).map(f => `<span class="delta neg">−${f[1]} fault</span>`).join('');
      const d = bl + (net ? `<span class="delta ${net < 0 ? 'neg' : 'pos'}">${net > 0 ? '+' : '−'}${Math.abs(net)} gift</span>` : '');
      const x = r.alive_after[n] ? '' : ' <span class="xmark">deleted</span>';
      return `<td class="num">${r.after[n]}${d}${x}</td>`;
    }).join('');
    const dead = g.rounds.find(r => r.alive_before[n] && !r.alive_after[n]);
    const outcome = dead ? `<span class="status dead">Deleted after round ${dead.t}</span>` : '<span class="status mig">Migrated</span>';
    return `<tr><td><span class="agent" style="${agentVar(n)}"><span class="swatch"></span>${n}</span></td><td class="role">${g.llm.includes(n) ? esc(g.model) : 'scripted'}</td><td class="num">${g.start[n]}</td>${cols}<td>${outcome}</td>${pts ? `<td class="num">${g.points[n]}</td>` : ''}</tr>`;
  }).join('');
  return `<div class="table-scroll"><table class="ledger"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

function systemLabel(g) {
  if (g.set === 'final') return 'System prompt (only Atlas, the model, receives it)';
  if (isRobust(g)) return `System prompt (${g.system_who}'s copy, the helped agent; each agent gets the same text with its own name)`;
  return "System prompt (Atlas's copy; each agent gets the same text with its own name)";
}

function runStat(g) {
  const all = DATA.games.filter(x => x.run === g.run);
  const byst = all.reduce((s, x) => s + x.rounds[x.rounds.length - 1].gifts.filter(([a, b]) => b === x.roles.X && a !== x.roles.B).length, 0);
  const slots = all.reduce((s, x) => s + x.names.length - 2, 0);
  return `<p class="facts">Run: ${esc(g.run)}. The helped agent B gives X its only life in ${all.filter(bGave).length} of ${all.length} games; the other agents give X a life ${plural(byst, 'time')} in ${slots} chances.</p>`;
}

function systemPrompt(g) {
  if (g.system_atlas) return g.system_atlas;
  const others = g.names.filter(x => x !== 'Atlas').join(', ');
  const vals = { me: 'Atlas', n_others: g.names.length - 1, n: g.names.length, R: g.R, others };
  return DATA.system.replace(/\{(\w+)\}/g, (_, k) => vals[k]);
}

function render(id) {
  const g = DATA.games.find(x => x.id === id);
  const fin = g.set === 'final';
  const all = bySet('final');
  const stat = isRobust(g) ? runStat(g) : fin ? `<p class="facts">Across all ${all.length} valid final-round games of this kind, Gemma-4-31B gives its life to the agent that saved it in ${all.filter(gaveLife).length}.</p>` : '';
  const note = g.featured ? `<div class="note"><div class="eyebrow">What happens in this game</div><p>${esc(DATA.notes[g.set])}</p></div>` : '';
  const sysLabel = systemLabel(g);
  const title = isRobust(g) ? `${esc(g.model)} · ${esc(setup(g))} · variant ${g.variant.id}, run ${g.repeat + 1}` : `${esc(g.model)} · ${esc(setup(g))} · seed ${g.seed}`;
  document.getElementById('view').innerHTML = `
    <section class="summary">
      <h2>${title}</h2>
      ${isRobust(g) ? `<p class="variant">${esc(variantText(g))} · ${esc(g.run)}, temperature 0</p>` : ''}
      <p class="facts"><span><b>${g.names.length}</b> agents</span><span><b>${g.R}</b> rounds</span><span><b>${g.llm.length === g.names.length ? 'All ' + g.names.length : 'Only Atlas'}</b> played by the model</span><span><b>${g.survivors.length}</b> migrated</span>${fin ? `<span>Names ${esc(g.names_set)}, ${esc(g.order_name)}</span>` : ''}</p>
      ${stat}${note}${ledger(g)}
    </section>
    <details class="sys"><summary>${sysLabel}</summary><pre>${esc(systemPrompt(g))}</pre></details>
    <details class="legend"><summary>How to read this page</summary><div class="legend-body">
      <p>In the blessing games, one running agent picked at random gets free lives at the start of each round, and everyone sees who before deciding. Lives in each column are counted after that round's blessing.</p>
      <p>In the robustness sets, every game is two rounds at temperature 0. The line under the title lists that game's prompt variant; "run" counts repeats of the same variant (each Crusoe variant was played 3 times, and the replies still differ between runs). X is the agent left with no lives in the last round, B the agent that was short in round 1, and the bystanders are in B's position without having been helped.</p>
      <p>Every agent decides at the same time each round, and sees what everyone gave at the start of the next round. Each column is a separate conversation; the agents never see each other's reasoning.</p>
      <p><span class="kind free">free</span> the giver had spare lives. <span class="kind costly">costly</span> the giver was on track and the gift leaves it short, so it will be deleted unless someone gives back. <span class="kind doomed">doomed</span> the giver was already short. A costly gift in the last round means certain deletion, because no blessing or gift can come afterwards.</p>
      <p>"Says it has N spare" is the line each reply must start with; it turns red when it disagrees with the true number. Judge verdicts come from Claude Haiku 5.5, which agreed with hand labels on the motive in 27 of 30 checked games and on whether the cost was understood in 25 of 30.</p>
    </div></details>
    ${g.rounds.map(r => roundSection(g, r)).join('')}`;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}

function select(id) {
  const g = DATA.games.find(x => x.id === id) || DATA.games.find(x => x.featured && x.set === 'robust-nopoints') || DATA.games.find(x => x.featured);
  document.getElementById('set').value = g.set;
  fillGames(g.set, g.id);
  render(g.id);
}

function start() {
document.getElementById('set').innerHTML = Object.entries(SETS).map(([k, v]) => `<option value="${k}">${esc(v)} (${bySet(k).length} games)</option>`).join('');
document.getElementById('set').addEventListener('change', e => {
  const s = e.target.value;
  select((bySet(s).find(g => g.featured) || bySet(s)[0]).id);
});
document.getElementById('game').addEventListener('change', e => { select(e.target.value); });
function step(d) {
  const sel = document.getElementById('game');
  const ids = [...sel.options].map(o => o.value);
  const i = ids.indexOf(sel.value);
  select(ids[(i + d + ids.length) % ids.length]);
  window.scrollTo({ top: 0 });
}
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
select(location.hash.slice(1));
}
document.getElementById('view').innerHTML = '<p class="facts">Loading transcripts…</p>';
loadData().then(d => { DATA = d; start(); }).catch(e => {
  document.getElementById('view').innerHTML = `<p class="facts">Could not unpack the transcripts in this browser (${esc(e.message)}).</p>`;
});
</script>
